[package]
name = "amble"
version = "0.1.1"
description = "A local-first meeting recorder and AI notepad"
authors = ["Alfred Nutile"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures-util = "0.3"

reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
# The local MCP server. `axum` shares hyper/tower with reqwest, so this adds
# little beyond the routing layer itself.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"

hound = "3.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
# System audio + microphone capture. `macos_15_0` is cumulative and unlocks the
# separate Microphone output type alongside system Audio on a single stream.
screencapturekit = { version = "8", features = ["macos_15_0"] }
