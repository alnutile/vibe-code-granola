name: Release

# Cut a release by pushing a tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Signs and notarizes when the APPLE_* secrets are present (see
# scripts/upload-signing-secrets.sh); otherwise it still builds, just unsigned,
# so forks and contributors get a working artifact rather than a failed job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Referenced by `if:` on the signing steps. GitHub doesn't allow `secrets.*`
  # in a step-level `if`, so it has to come through the env context.
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

jobs:
  build:
    # Needs the macOS 26 SDK, not just macOS 15+ at runtime.
    #
    # ScreenCaptureKit pulls in `apple-metal`, whose Swift bridge references
    # MTLSamplerReductionMode and MTLSamplerDescriptor.lodBias behind an
    # `if #available(macOS 26.0, *)`. That check is a *runtime* guard — the
    # symbols still have to exist in the SDK at compile time — so an older
    # Xcode fails with "cannot find 'MTLSamplerReductionMode' in scope".
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check
        # Tests run in release so their dependency artifacts are reused by the
        # build below, rather than compiling the whole tree twice.
        run: |
          npx tsc --noEmit
          cargo test --release --manifest-path src-tauri/Cargo.toml

      # Signing is optional: forks and contributors without the secrets still get
      # a working (unsigned) build rather than a red X.
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null

          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build
        env:
          # Tauri signs when APPLE_SIGNING_IDENTITY is set, and notarizes when
          # the Apple ID trio is present too. Empty values mean an unsigned build.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build

      - name: Verify signature
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: ./scripts/verify-signing.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
          body: |
            ## Install

            Download the `.dmg`, open it, and drag **Amble** to Applications.

            Signed and notarized by Apple — it opens normally, no warnings.

            <sub>If you see a Gatekeeper warning, this build came out unsigned:
            right-click Amble → **Open** → **Open**.</sub>

            ## First run

            Requires **macOS 15 or later**.

            1. Grant Screen Recording (Settings → Recording), then **quit and reopen** Amble
            2. Set up transcription — whisper.cpp is recommended and runs entirely on your Mac
            3. Point the chat model at Ollama, LM Studio, OpenRouter, or OpenAI

            Full setup instructions are in the [README](https://github.com/${{ github.repository }}#readme).
